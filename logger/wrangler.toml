name = "droonialarm-sitrep-logger"
main = "src/worker.ts"
compatibility_date = "2025-09-23"
compatibility_flags = ["nodejs_compat"]

# Cron — Cloudflare minimum is 1 minute. We poll every minute.
# When we want sub-minute granularity later, swap to a Durable Object alarm.
[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "droonialarm-sitrep"
# database_id is filled in by `wrangler d1 create` and pasted here.
database_id = "ebd9c3ab-6143-4a41-9688-60940a948b63"

# A simple Worker route for the inspection UI.
# After deploy, the Worker is reachable at <name>.<account>.workers.dev as well.
# [routes]  # uncomment + set if you wire a custom domain later
# pattern = "alarm-logger.your-domain.ee/*"
# zone_name = "your-domain.ee"

[observability]
enabled = true
